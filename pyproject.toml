[project]
name = "primo-agente"
version = "0.1.0"
description = "Agentic customer-care triage demo (Lezioni 9-16): LLM, memoria, RAG, ReAct, multi-agent, CrewAI/AutoGen"
dependencies = [
    "chromadb>=0.5",
    "openai",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov"
]
dev = [
    "ruff"
]
multiagent = [
    "crewai>=0.80",
    "autogen-agentchat>=0.4",
    "autogen-ext[openai]>=0.4",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
triage-benchmark = "benchmark:run_triage_benchmark"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # crewai: import side-effect su sottomodulo rag (dipendenza opzionale L16+)
    "ignore:Cannot set an attribute on 'crewai.rag':ImportWarning",
    # crewai: deprecazioni interne Agent (non nel nostro codice)
    "ignore::DeprecationWarning:crewai",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]